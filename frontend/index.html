<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordertron — Voice Agent</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090b14;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            font-size: 15px;
            color: #6366f1;
            /* purple-blue */
            margin-bottom: 20px;
            text-align: center;
        }

        /* ── The Glowing Orb ───────────────────────────────── */
        .orb-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }

        .orb {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle at center, #0c1024 0%, #090b14 80%);
            border: 2px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .orb::before {
            /* The gradient glowing border */
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            z-index: -1;
            opacity: 0.3;
            transition: opacity 0.4s ease;
        }

        .orb.active {
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.4), inset 0 0 40px rgba(168, 85, 247, 0.2);
        }

        .orb.active::before {
            opacity: 1;
            animation: pulse-ring 2s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.03);
                opacity: 0.8;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Ambient background wave flares (simulated with large blurred backgrounds) */
        .ambient-flare {
            position: absolute;
            width: 400px;
            height: 100px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0) 0%, rgba(59, 130, 246, 0.15) 30%, rgba(168, 85, 247, 0.15) 70%, rgba(168, 85, 247, 0) 100%);
            filter: blur(20px);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
            border-radius: 50%;
        }

        .orb.active~.ambient-flare {
            opacity: 1;
        }

        /* Volume bars INSIDE the orb */
        #volumeBar {
            display: flex;
            align-items: center;
            /* center vertically */
            justify-content: center;
            gap: 5px;
            height: 60px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 3;
        }

        #volumeBar.visible {
            opacity: 1;
        }

        .bar {
            width: 4px;
            border-radius: 2px;
            background: #fff;
            transition: height 0.08s ease;
            min-height: 4px;
        }

        /* Base flat line when inactive */
        .flat-line {
            width: 100px;
            height: 3px;
            background: #333;
            border-radius: 2px;
            position: absolute;
            opacity: 1;
            transition: opacity 0.3s;
        }

        .orb.active .flat-line {
            opacity: 0;
        }


        /* ── The Mic Button ────────────────────────────────── */
        #callBtn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            color: #fff;
            z-index: 10;
        }

        #callBtn:hover {
            transform: scale(1.08);
            box-shadow: 0 12px 35px rgba(99, 102, 241, 0.6);
        }

        #callBtn:active {
            transform: scale(0.95);
        }

        #callBtn.active {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        #callBtn.connecting {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.4);
            animation: btn-pulse 1.2s infinite;
        }

        @keyframes btn-pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        #errorMsg {
            font-size: 13px;
            color: #f87171;
            min-height: 18px;
        }


        /* ── Transcript Panel (Preserved Structure) ────────── */
        #transcriptCard {
            background: #12141d;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            width: 90%;
            max-width: 520px;
            height: 380px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            margin-top: 10px;
        }

        #transcriptHeader {
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #151822;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            transition: background 0.3s;
        }

        .dot.live {
            background: #22c55e;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.3
            }
        }

        #transcriptBody {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        #transcriptBody::-webkit-scrollbar {
            width: 6px;
        }

        #transcriptBody::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        #transcriptEmpty {
            color: #555;
            font-size: 14px;
            text-align: center;
            margin: auto;
            font-weight: 500;
        }

        .msg {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .msg.assistant {
            align-self: flex-start;
        }

        .msg.user {
            align-self: flex-end;
        }

        .msg-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #666;
            padding: 0 4px;
        }

        .msg.user .msg-label {
            text-align: right;
            color: #a855f7;
        }

        .msg.assistant .msg-label {
            text-align: left;
            color: #3b82f6;
        }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .msg.assistant .msg-bubble {
            background: #1a1e2d;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        .msg.user .msg-bubble {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .msg-bubble.partial {
            opacity: 0.6;
            font-style: italic;
        }

        footer {
            font-size: 12px;
            color: #444;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div>
        <h1>Voice Assistant</h1>
        <p id="statusText" class="subtitle">Ready to connect</p>
    </div>

    <!-- The Glowing Orb -->
    <div class="orb-container">
        <div class="ambient-flare"></div>
        <div class="orb" id="mainOrb">
            <div class="flat-line"></div>

            <div id="volumeBar">
                <div class="bar" id="b1"></div>
                <div class="bar" id="b2"></div>
                <div class="bar" id="b3"></div>
                <div class="bar" id="b4"></div>
                <div class="bar" id="b5"></div>
                <div class="bar" id="b6"></div>
                <div class="bar" id="b7"></div>
                <div class="bar" id="b8"></div>
                <div class="bar" id="b9"></div>
                <div class="bar" id="b10"></div>
                <div class="bar" id="b11"></div>
            </div>
        </div>
    </div>

    <!-- Central Mic Button -->
    <div>
        <button id="callBtn" title="Start call">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" x2="12" y1="19" y2="22"></line>
            </svg>
        </button>
        <p id="errorMsg"></p>
    </div>

    <!-- Transcript Panel (Kept exactly as requested but restyled to match) -->
    <div id="transcriptCard">
        <div id="transcriptHeader">
            <span class="dot" id="liveDot"></span>
            Live Transcript
        </div>
        <div id="transcriptBody">
            <p id="transcriptEmpty">Transcript will appear here during the call.</p>
        </div>
    </div>


    <!-- Vapi Web SDK -->
    <script type="module">
        import _VapiModule from "https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/+esm";
        const Vapi = _VapiModule.default ?? _VapiModule;

        const VAPI_PUBLIC_KEY = "__VAPI_PUBLIC_KEY__";
        const ASSISTANT_ID = "__VAPI_ASSISTANT_ID__";

        const btn = document.getElementById("callBtn");
        const statusText = document.getElementById("statusText");
        const errorMsg = document.getElementById("errorMsg");
        const mainOrb = document.getElementById("mainOrb");
        const volumeBar = document.getElementById("volumeBar");
        const bars = Array.from(document.querySelectorAll(".bar"));
        const txBody = document.getElementById("transcriptBody");
        const txEmpty = document.getElementById("transcriptEmpty");
        const liveDot = document.getElementById("liveDot");

        const partials = {};

        function addMessage(role, text, isPartial) {
            if (txEmpty) txEmpty.style.display = "none";
            if (isPartial) {
                if (!partials[role]) {
                    const wrap = document.createElement("div");
                    wrap.className = `msg ${role}`;
                    wrap.innerHTML = `<span class="msg-label">${role === "assistant" ? "Ordertron" : "You"}</span><div class="msg-bubble partial"></div>`;
                    txBody.appendChild(wrap);
                    partials[role] = wrap.querySelector(".msg-bubble");
                }
                partials[role].textContent = text;
            } else {
                if (partials[role]) {
                    partials[role].textContent = text;
                    partials[role].classList.remove("partial");
                    delete partials[role];
                } else {
                    const wrap = document.createElement("div");
                    wrap.className = `msg ${role}`;
                    wrap.innerHTML = `<span class="msg-label">${role === "assistant" ? "Ordertron" : "You"}</span><div class="msg-bubble"></div>`;
                    wrap.querySelector(".msg-bubble").textContent = text;
                    txBody.appendChild(wrap);
                }
            }
            txBody.scrollTop = txBody.scrollHeight;
        }

        const vapi = new Vapi(VAPI_PUBLIC_KEY);

        let callActive = false;
        let volumeInterval = null;

        function setStatus(text, type = "idle") {
            statusText.textContent = text;
            statusText.style.color = type === "active" ? "#a855f7" : (type === "idle" ? "#666" : "#f59e0b");
            errorMsg.textContent = "";

            btn.className = type === "active" ? "active" : type === "connecting" ? "connecting" : "";

            if (type === "active") {
                btn.innerHTML = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>`;
            } else {
                btn.innerHTML = `<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>`;
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            setStatus("Tap to try again", "idle");
        }

        // A more symmetric wave animation for the orb
        function animateBars(level = 0) {
            const center = Math.floor(bars.length / 2);
            bars.forEach((bar, index) => {
                // Create a bell-curve effect (taller in middle)
                const dist = Math.abs(index - center);
                const maxH = 50 - (dist * 8);

                const rand = Math.random() * 0.4 + 0.8; // 0.8 to 1.2
                const h = level > 0 ? Math.max(4, Math.round(maxH * level * rand)) : 4;
                bar.style.height = h + "px";

                // Color gradient matching the orb
                bar.style.background = level > 0 ? `linear-gradient(180deg, #3b82f6, #a855f7)` : `#fff`;
            });
        }

        function startVolumeAnim() {
            mainOrb.classList.add("active");
            volumeBar.classList.add("visible");

            // Default idle pulse when active but no sound
            volumeInterval = setInterval(() => animateBars(0.3), 150);
        }

        function stopVolumeAnim() {
            mainOrb.classList.remove("active");
            clearInterval(volumeInterval);
            volumeInterval = null;
            animateBars(0);
            volumeBar.classList.remove("visible");
        }

        vapi.on("call-start", () => {
            callActive = true;
            setStatus("I'm listening...", "active");
            startVolumeAnim();
            liveDot.classList.add("live");
        });

        vapi.on("call-end", () => {
            callActive = false;
            stopVolumeAnim();
            setStatus("Ready to connect", "idle");
            liveDot.classList.remove("live");
        });

        vapi.on("message", (msg) => {
            if (msg?.type === "transcript") {
                const role = msg.role;
                const text = msg.transcript ?? "";
                const isFinal = msg.transcriptType === "final";
                if (text.trim()) addMessage(role, text, !isFinal);
            }
        });

        vapi.on("volume-level", (vol) => {
            // vol is typically 0.0 to 1.0 from Vapi
            if (vol > 0.05) {
                animateBars(vol * 2.5); // Multiply to make the wave visibly bounce inside orb
            }
        });

        vapi.on("error", (err) => {
            console.error("Vapi error:", err);
            if (err?.error?.type === "daily-call-object-creation-error" ||
                err?.type === "daily-error") return;
            showError("Something went wrong — check console.");
            stopVolumeAnim();
            callActive = false;
        });

        async function startCall() {
            errorMsg.textContent = "";
            setStatus("Connecting...", "connecting");
            try {
                await vapi.start(ASSISTANT_ID);
            } catch (err) {
                console.error(err);
                showError("Could not start call. Check your keys.");
            }
        }

        async function endCall() {
            await vapi.stop();
        }

        btn.addEventListener("click", () => {
            if (callActive) {
                endCall();
            } else {
                startCall();
            }
        });
    </script>
</body>

</html>
